# Nav2 parameters for a 0.36 x 0.30 m differential-drive robot with a 360-beam
# 2D lidar at 10 Hz.
#
# Tuned rather than copied. The values that differ from the Nav2 defaults are
# the ones commented; the rest are defaults on purpose, because changing a
# parameter you cannot justify is how a navigation stack becomes unexplainable.

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan

    # 2000 particles rather than the 500 default. This office is small and
    # visually repetitive - two doorways, four straight walls - so the particle
    # filter has genuinely ambiguous hypotheses to carry. Under-particling
    # shows up as confident, wrong convergence after a rotation.
    min_particles: 500
    max_particles: 2000

    # The odometry noise model. alpha1/alpha2 are rotation noise from rotation
    # and translation; alpha3/alpha4 the same for translation. Left at zero,
    # AMCL trusts the wheels completely and never corrects them.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.16
    max_beams: 60

    # Update on movement, not on time. A stationary robot resampling its
    # particle filter loses diversity for no new information - particle
    # deprivation, and it ends with every particle in the same wrong place.
    update_min_d: 0.2
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 1.0

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    set_initial_pose: true
    initial_pose:
      x: 3.0            # the lobby - matches the spawn pose in simulation.launch.py
      y: 3.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # 0.25 m is loose enough that the robot does not hunt for the last
      # centimetre, tight enough that "at the printer" means at the printer.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # These MUST match the safety governor's limits in config/safety.yaml.
      # If DWB plans faster than the governor allows, every trajectory it
      # evaluates gets clamped on the way out, the robot follows none of them,
      # and the controller blames the path.
      min_vel_x: -0.15
      max_vel_x: 0.45
      max_vel_theta: 1.2
      acc_lim_x: 0.6
      acc_lim_theta: 2.0
      decel_lim_x: -0.6
      decel_lim_theta: -2.0
      min_speed_theta: 0.0
      min_speed_xy: 0.0
      max_speed_xy: 0.45

      vx_samples: 20
      vtheta_samples: 40
      sim_time: 1.7
      transform_tolerance: 0.2

      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      # PathAlign is weighted above GoalAlign because in a corridor the useful
      # instruction is "stay on the path", not "point at the goal" - the goal
      # is frequently through a wall.
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      BaseObstacle.scale: 0.02
      RotateToGoal.scale: 32.0
      Oscillation.scale: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      # A circle, not a footprint polygon. This chassis is 0.36 x 0.30 m, so a
      # 0.22 m circumscribed radius covers it in any orientation. A polygon
      # footprint is more precise and much slower to check; for a robot this
      # close to round the precision buys nothing.
      robot_radius: 0.22

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0.55 m against 1.2 m doorways: the inflated cost gradient still leaves
        # a free channel. Raise this to 0.7 and both doorways close, the planner
        # reports "no valid path", and the map looks fine to a human.
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 6.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "office.yaml"

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      # A* rather than Dijkstra. Same optimal path on this map, fewer
      # expansions - which is the same trade robot_core/planners.py makes, and
      # for the same reason.
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    # Recovery velocities, and deliberately slower than the navigation limits.
    # Recovery happens when the robot is confused about where it is; moving
    # fast while confused is how a recovery becomes a collision.
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.45, 0.0, 1.2]
    min_velocity: [-0.15, 0.0, -1.2]
    max_accel: [0.6, 0.0, 2.0]
    max_decel: [-0.6, 0.0, -2.0]
    # Publishes to cmd_vel_raw, NOT cmd_vel. The safety governor owns cmd_vel
    # and is the last writer before the base. Point this at cmd_vel and Nav2
    # bypasses the safety layer entirely - which is the single most important
    # line in this file.
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200
