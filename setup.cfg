[flake8]
# 89 rather than 79. Descriptive ROS type and topic names do not fit in 79
# columns without wrapping that hurts readability more than the length does.
max-line-length = 89
extend-ignore =
    # Whitespace before ':' - conflicts with how slices are formatted.
    E203,
    # Line break before a binary operator; the opposite (W504) is the modern
    # preference and enabling both is contradictory.
    W503
exclude = build,install,log,.git

[tool:pytest]
# Registered so the ament lint markers do not produce a warning on every run.
markers =
    flake8: ament flake8 style check
    linter: any ament lint check
# The two lint files are named per package. pytest imports test modules by
# basename, so two files called test_flake8.py in one run collide - and the
# error it prints ("import file mismatch") does not mention that.
testpaths = src
